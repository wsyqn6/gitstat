name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - run: |
          mkdir -p backend/web/dist
          cp -r frontend/dist/* backend/web/dist/
          cd backend && go build -ldflags="-s -w" .

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Update version in docs
        run: |
          sed -i "s/__VERSION__/${{ github.ref_name }}/g" docs/index.html
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: node frontend/scripts/sync-version.mjs
      - run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm build
          mkdir -p ../backend/web/dist
          cp -r dist/* ../backend/web/dist/
      - run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o gitstat-linux-amd64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o gitstat-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o gitstat-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o gitstat-darwin-arm64 .
      - name: Commit version update
        run: |
          git config user.name "GitStat CD"
          git config user.email "cd@gitstat.dev"
          git add docs/index.html frontend/package.json
          git diff --staged --quiet || git commit -m "chore: update version to ${{ github.ref_name }}"
          git pull --rebase origin main && git push origin HEAD:main
      - uses: softprops/action-gh-release@v2
        with:
          files: backend/gitstat-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
