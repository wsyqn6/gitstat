name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm build
      - run: |
          mkdir -p backend/web/dist
          cp -r frontend/dist/* backend/web/dist/
          cd backend && go build -ldflags="-s -w" .

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, ext: '' }
          - { os: windows, arch: amd64, ext: .exe }
          - { os: darwin, arch: amd64, ext: '' }
          - { os: darwin, arch: arm64, ext: '' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: |
          cd frontend && pnpm install --frozen-lockfile && pnpm build
          mkdir -p ../backend/web/dist
          cp -r dist/* ../backend/web/dist/
      - run: |
          cd backend
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o gitstat${{ matrix.ext }} .
      - uses: softprops/action-gh-release@v2
        with:
          files: backend/gitstat${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
